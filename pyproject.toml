[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securia"
version = "0.3.0"
description = "ローカルで完結する脆弱性スキャナ（依存関係・静的コード・設定ファイル）"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "nico0748" }]
keywords = ["security", "sbom", "vulnerability", "scanner", "osv", "sast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# 実行時依存はゼロ。標準ライブラリのみで動作する。
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
securia = "securia.cli:main"

[project.urls]
Homepage = "https://github.com/nico0748/Securia"
Issues = "https://github.com/nico0748/Securia/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
securia = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
